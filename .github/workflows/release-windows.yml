name: Release Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Print uv version
        run: uv --version

      - name: Select lockfile (Windows)
        shell: pwsh
        run: |
          Copy-Item -Force uv.lock.windows uv.lock

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Build app (Nuitka)
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1

      - name: Install Inno Setup 6 (Chocolatey)
        shell: pwsh
        run: |
          choco --version
          choco install innosetup --no-progress -y

      - name: ISCC diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "TAG_NAME=$env:TAG_NAME"

          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )

          foreach ($p in $candidates) {
            if ($p -and (Test-Path $p)) {
              Write-Host "Found ISCC candidate: $p"
              try {
                $v = (Get-Item $p).VersionInfo
                Write-Host ("ISCC FileVersion: {0}" -f $v.FileVersion)
                Write-Host ("ISCC ProductVersion: {0}" -f $v.ProductVersion)
              } catch {}
            }
          }

          try { where.exe ISCC.exe } catch {}
          try {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { Write-Host ("ISCC resolved to: {0}" -f $cmd.Source) }
          } catch {}

          $iscc = $null
          foreach ($p in $candidates) { if (-not $iscc -and $p -and (Test-Path $p)) { $iscc = $p } }
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if ($iscc) {
            Write-Host "ISCC /? output:"
            & $iscc /? 2>&1 | Out-Host
            $global:LASTEXITCODE = 0
          } else {
            Write-Host "ISCC.exe not found after installation."
          }

          $issPath = "installer/pomodoro-tray-timer.iss"
          $distDir = "dist/pomodoro-tray-timer"
          Write-Host ("Precheck: Test-Path {0} => {1}" -f $issPath, (Test-Path $issPath))
          Write-Host ("Precheck: Test-Path {0} => {1}" -f $distDir, (Test-Path $distDir))

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.ref_name }}
          path: |
            dist/pomodoro-tray-timer/**
            dist-installer/pomodoro-tray-timer-setup.exe

      - name: Create/Update GitHub Release and upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG_NAME
          if (-not $tag) { throw "TAG_NAME is empty" }

          $installerPath = "dist-installer/pomodoro-tray-timer-setup.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Installer not found: $installerPath"
          }

          $assetName = "pomodoro-tray-timer-setup-$tag.exe"
          Write-Host "Uploading asset: $assetName"

          gh --version
          # Repo enables "Immutable releases": assets cannot be uploaded/overwritten
          # after the release is published. Use the draft->upload->publish flow.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --notes "" "$installerPath#$assetName"
            gh release edit $tag --draft=false
            exit 0
          }

          $isDraft = (gh release view $tag --json isDraft -q .isDraft)
          if ($isDraft -ne "true") {
            throw "Release '$tag' is already published and immutable; cannot upload/replace assets. Please create a new tag to publish new assets."
          }

          gh release upload $tag "$installerPath#$assetName" --clobber
          gh release edit $tag --draft=false
