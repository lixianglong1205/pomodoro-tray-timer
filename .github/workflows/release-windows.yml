name: Release Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Print uv version
        run: uv --version

      - name: Verify lockfile up-to-date
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Restore Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuitka-ci
          key: ${{ runner.os }}-nuitka-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install Inno Setup 6 (Chocolatey)
        shell: pwsh
        run: |
          choco --version
          choco install innosetup --no-progress -y

      - name: Build app (Nuitka)
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: ~/.cache/nuitka-ci
        run: |
          ./scripts/build-windows.ps1

      - name: ISCC diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "TAG_NAME=$env:TAG_NAME"

          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )

          foreach ($p in $candidates) {
            if ($p -and (Test-Path $p)) {
              Write-Host "Found ISCC candidate: $p"
              try {
                $v = (Get-Item $p).VersionInfo
                Write-Host ("ISCC FileVersion: {0}" -f $v.FileVersion)
                Write-Host ("ISCC ProductVersion: {0}" -f $v.ProductVersion)
              } catch {}
            }
          }

          try { where.exe ISCC.exe } catch {}
          try {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { Write-Host ("ISCC resolved to: {0}" -f $cmd.Source) }
          } catch {}

          $iscc = $null
          foreach ($p in $candidates) { if (-not $iscc -and $p -and (Test-Path $p)) { $iscc = $p } }
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if ($iscc) {
            Write-Host "ISCC /? output:"
            & $iscc /? 2>&1 | Out-Host
            $global:LASTEXITCODE = 0
          } else {
            Write-Host "ISCC.exe not found after installation."
          }

          $issPath = "installer/pomodoro-tray-timer.iss"
          $distDir = "dist/pomodoro-tray-timer"
          Write-Host ("Precheck: Test-Path {0} => {1}" -f $issPath, (Test-Path $issPath))
          Write-Host ("Precheck: Test-Path {0} => {1}" -f $distDir, (Test-Path $distDir))

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.ref_name }}
          path: |
            dist/pomodoro-tray-timer/**
            dist-installer/pomodoro-tray-timer-setup.exe

      - name: Create/Update GitHub Release and upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG_NAME
          if (-not $tag) { throw "TAG_NAME is empty" }

          $installerPath = "dist-installer/pomodoro-tray-timer-setup.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Installer not found: $installerPath"
          }

          $assetName = "pomodoro-tray-timer-setup-$tag.exe"
          Write-Host "Uploading asset: $assetName"

          gh --version
          # Repo enables "Immutable releases": once a release is published,
          # assets cannot be added/replaced. macOS and Windows workflows run
          # in parallel, so each job ensures the release exists as a DRAFT,
          # uploads its own asset, and only flips draft=false when BOTH the
          # Windows (.exe) and macOS (.dmg) expected assets are present.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --notes ""
          }

          $isDraft = (gh release view $tag --json isDraft -q .isDraft)
          if ($isDraft -ne "true") {
            throw "Release '$tag' is already published and immutable; cannot upload/replace assets. Please create a new tag to publish new assets."
          }

          gh release upload $tag "$installerPath#$assetName" --clobber

          $expectedExe = "pomodoro-tray-timer-setup-$tag.exe"
          $expectedDmg = "pomodoro-tray-timer-$tag.dmg"

          # Retry to handle GitHub API eventual consistency
          $hasBoth = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $assetsJson = gh release view $tag --json assets -q '.assets[].name'
            $hasExe = $false; $hasDmg = $false
            foreach ($name in $assetsJson) {
              $trimmed = $name.Trim()
              if ($trimmed -eq $expectedExe) { $hasExe = $true }
              if ($trimmed -eq $expectedDmg) { $hasDmg = $true }
            }
            Write-Host ("Release assets (attempt {0}): hasExe={1}, hasDmg={2}" -f $attempt, $hasExe, $hasDmg)
            if ($hasExe -and $hasDmg) {
              $hasBoth = $true
              break
            }
            Start-Sleep -Seconds 3
          }

          if ($hasBoth) {
            Write-Host "Both platform assets present; publishing release."
            gh release edit $tag --draft=false
          } else {
            Write-Host "Peer asset not yet present; leaving release as draft."
          }
