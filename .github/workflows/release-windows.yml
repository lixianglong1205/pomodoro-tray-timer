name: Release Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Print uv version
        run: uv --version

      - name: Verify lockfile up-to-date
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --group build --locked

      - name: Restore Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuitka-ci
          key: ${{ runner.os }}-nuitka-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install Inno Setup 6 (Chocolatey)
        shell: pwsh
        run: |
          choco --version
          choco install innosetup --no-progress -y

      - name: Build app (Nuitka)
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: ~/.cache/nuitka-ci
        run: |
          ./scripts/build-windows.ps1

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.ref_name }}
          path: dist-installer/pomodoro-tray-timer-setup.exe
          retention-days: 1

      - name: Create/Update GitHub Release and upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG_NAME
          if (-not $tag) { throw "TAG_NAME is empty" }

          $installerPath = "dist-installer/pomodoro-tray-timer-setup.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Installer not found: $installerPath"
          }

          $assetName = "pomodoro-tray-timer-setup-$tag.exe"
          Write-Host "Uploading asset: $assetName"

          gh --version

          function gh_retry {
            param([scriptblock]$Block)
            for ($i = 0; $i -lt 3; $i++) {
              $result = & $Block 2>&1
              if ($LASTEXITCODE -eq 0) { return $result }
              Start-Sleep -Seconds (($i + 1) * 2)
            }
            throw "gh command failed after 3 retries"
          }

          # Repo enables "Immutable releases": once a release is published,
          # assets cannot be added/replaced. macOS and Windows workflows run
          # in parallel, so each job ensures the release exists as a DRAFT,
          # uploads its own asset, and only flips draft=false when BOTH the
          # Windows (.exe) and macOS (.dmg) expected assets are present.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --notes ""
          }

          $isDraft = (gh release view $tag --json isDraft -q .isDraft 2>$null)
          if ($isDraft -ne "true") {
            Write-Host "Release '$tag' is already published and immutable; nothing to do."
            exit 0
          }

          try {
            gh_retry -Block { gh release upload $tag "$installerPath#$assetName" --clobber }
          } catch {
            Write-Host "Warning: upload failed, but continuing to check assets."
          }

          $expectedExe = "pomodoro-tray-timer-setup-$tag.exe"
          $expectedDmg = "pomodoro-tray-timer-$tag.dmg"

          # Retry to handle GitHub API eventual consistency
          $hasBoth = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $assetsJson = gh release view $tag --json assets -q '.assets[].name' 2>$null
            $hasExe = $false; $hasDmg = $false
            foreach ($name in $assetsJson) {
              $trimmed = $name.Trim()
              if ($trimmed -eq $expectedExe) { $hasExe = $true }
              if ($trimmed -eq $expectedDmg) { $hasDmg = $true }
            }
            Write-Host ("Release assets (attempt {0}): hasExe={1}, hasDmg={2}" -f $attempt, $hasExe, $hasDmg)
            if ($hasExe -and $hasDmg) {
              $hasBoth = $true
              break
            }
            Start-Sleep -Seconds 3
          }

          if ($hasBoth) {
            Write-Host "Both platform assets present; publishing release."
            gh release edit $tag --draft=false 2>$null
          } else {
            Write-Host "Peer asset not yet present; leaving release as draft."
          }
